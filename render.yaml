services:
  - type: web
    name: catechism
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false        # Paste your Neon PostgreSQL connection string here
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false        # Set to your Render URL, e.g. https://catechism.onrender.com
